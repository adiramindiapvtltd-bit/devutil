<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTTP Status Code Lookup Online — Free | DevUtil</title>
<meta name="description" content="Free online HTTP status code reference. Search HTTP status codes and what they mean.">
<link rel="canonical" href="https://example.com/tools/http-status-codes/">
<script>(function(){try{var d=localStorage.getItem('devutil.theme')==='dark';document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
<meta name="theme-color" content="#eef1f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.code-list { list-style: none; margin: 14px 0 0; padding: 0; }
.code-list li { display: flex; align-items: baseline; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.code-list .num { font-family: var(--mono); font-weight: 700; font-size: 15px; width: 44px; flex: none; }
.code-list .num.c2 { color: var(--good); }
.code-list .num.c3 { color: var(--hue, var(--accent)); }
.code-list .num.c4 { color: var(--warn); }
.code-list .num.c5 { color: var(--bad); }
.code-list .name { font-weight: 600; }
.code-list .desc { display: block; color: var(--text-3); font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>
<noscript><div class="noscript">This tool runs in your browser — please enable JavaScript to use it.</div></noscript>
<a class="skip" href="#main">Skip to the tool</a>
<div id="site-header"></div>

<main id="main" class="wrap page">
  <p class="crumbs"><a href="/">All tools</a><span class="sep">/</span><span class="cat-tag" data-cat="Web">Web &amp; CSS</span></p>
  <div class="page-head">
    <h1>HTTP Status Code Lookup</h1>
    <p class="lede">Search HTTP status codes and what they mean.</p>
  </div>

  <div class="card tool" data-cat="Web">
    <div class="field">
      <label for="q">Search by code or name</label>
      <input type="text" id="q" placeholder="404, not found, redirect…">
    </div>
    <ul class="code-list" id="list"></ul>
  </div>

  <details class="guide">
    <summary class="guide-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 3.5"/><path d="M12 17h.01"/></svg>
      How this works &amp; FAQ
    </summary>
    <div class="guide-body">
      <div class="content"><p>Type a status code or a keyword to filter the list. 2xx codes are green (success), 3xx blue (redirection), 4xx orange (client error), 5xx red (server error).</p></div>
    </div>
  </details>
</main>

<div id="site-footer"></div>
<script src="/assets/js/tools-data.js"></script>
<script src="/assets/js/chrome.js"></script>
<script>
var CODES = [
  [100, 'Continue', 'The server has received the request headers and the client should proceed to send the body.'],
  [101, 'Switching Protocols', 'The server is switching protocols as requested by the client (e.g. to WebSocket).'],
  [200, 'OK', 'The request succeeded.'],
  [201, 'Created', 'The request succeeded and a new resource was created.'],
  [202, 'Accepted', 'The request was accepted for processing, but processing is not complete.'],
  [204, 'No Content', 'The request succeeded but there is no content to return.'],
  [206, 'Partial Content', 'Only part of the resource is being delivered, as requested via a Range header.'],
  [301, 'Moved Permanently', 'The resource has permanently moved to a new URL.'],
  [302, 'Found', 'The resource temporarily resides at a different URL.'],
  [303, 'See Other', 'The response can be found at another URL using a GET request.'],
  [304, 'Not Modified', 'The cached version of the resource is still valid.'],
  [307, 'Temporary Redirect', 'Like 302, but the method and body must not change.'],
  [308, 'Permanent Redirect', 'Like 301, but the method and body must not change.'],
  [400, 'Bad Request', 'The server could not understand the request due to invalid syntax.'],
  [401, 'Unauthorized', 'Authentication is required and has failed or not been provided.'],
  [402, 'Payment Required', 'Reserved for future use.'],
  [403, 'Forbidden', 'The client does not have access rights to the content.'],
  [404, 'Not Found', 'The server cannot find the requested resource.'],
  [405, 'Method Not Allowed', 'The request method is known but not supported by the target resource.'],
  [406, 'Not Acceptable', "The server can't produce a response matching the client's Accept headers."],
  [408, 'Request Timeout', 'The server timed out waiting for the request.'],
  [409, 'Conflict', 'The request conflicts with the current state of the server.'],
  [410, 'Gone', 'The resource is no longer available and has been permanently removed.'],
  [411, 'Length Required', 'The request did not specify the length of its content.'],
  [413, 'Payload Too Large', 'The request entity is larger than limits the server is willing to process.'],
  [414, 'URI Too Long', 'The URI requested is longer than the server is willing to interpret.'],
  [415, 'Unsupported Media Type', "The media format of the request is not supported by the server."],
  [418, "I'm a Teapot", 'An April Fools\' joke from RFC 2324 — the server refuses to brew coffee because it is a teapot.'],
  [422, 'Unprocessable Entity', 'The request was well-formed but contains semantic errors.'],
  [429, 'Too Many Requests', "The user has sent too many requests in a given time (rate limiting)."],
  [500, 'Internal Server Error', 'The server encountered an unexpected condition.'],
  [501, 'Not Implemented', 'The server does not support the functionality required.'],
  [502, 'Bad Gateway', 'The server, acting as a gateway, received an invalid response from the upstream server.'],
  [503, 'Service Unavailable', 'The server is not ready to handle the request, often due to overload or maintenance.'],
  [504, 'Gateway Timeout', 'The server, acting as a gateway, did not get a response in time from the upstream server.'],
  [505, 'HTTP Version Not Supported', 'The server does not support the HTTP protocol version used in the request.']
];

var list = document.getElementById('list');
var q = document.getElementById('q');

function render(filter) {
  var f = (filter || '').toLowerCase();
  var filtered = CODES.filter(function (c) {
    return !f || String(c[0]).indexOf(f) !== -1 || c[1].toLowerCase().indexOf(f) !== -1 || c[2].toLowerCase().indexOf(f) !== -1;
  });
  list.innerHTML = filtered.map(function (c) {
    return '<li><span class="num c' + Math.floor(c[0] / 100) + '">' + c[0] + '</span><span><span class="name">' + c[1] + '</span><span class="desc">' + c[2] + '</span></span></li>';
  }).join('') || '<li style="color:var(--text-3)">No matches.</li>';
}

q.addEventListener('input', function () { render(q.value); });
render('');
</script>
</body>
</html>
